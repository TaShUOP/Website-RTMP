<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WC26 LIVE - iOS Player</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column;
    }
    .header {
      padding: 16px;
      display: flex; justify-content: space-between; align-items: center;
      background: var(--panel);
      border-bottom: 1px solid #334155;
    }
    .brand { font-size: 20px; font-weight: bold; }
    .brand span { color: var(--accent); }
    .back-btn {
      color: var(--text);
      text-decoration: none;
      background: #334155;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    .video-container {
      width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .chat-container {
      flex: 1;
      display: flex; flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 12px;
      font-size: 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .message { background: var(--panel); padding: 8px 12px; border-radius: 8px; }
    .msg-user { font-weight: bold; color: var(--accent); margin-right: 6px; }
    .chat-input-area {
      display: flex; gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--bg);
      color: var(--text);
    }
    button {
      padding: 12px 16px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }
    .config-area {
      padding: 16px; background: var(--panel);
      display: flex; flex-direction: column; gap: 8px;
    }
    .config-area label { font-size: 12px; color: #94a3b8; }
  </style>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <div class="header">
    <div class="brand">WC26<span>iOS</span></div>
    <!-- We don't want a back button if they are forced here by the auto-redirect, otherwise they'd get stuck in a loop! -->
  </div>

  <div class="video-container">
    <video id="iosPlayer" controls playsinline autoplay muted></video>
  </div>



  <div class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Send a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('iosPlayer');
    
    const urlParams = new URLSearchParams(window.location.search);
    const streamKey = urlParams.get('streamKey') || 'worldcup';
    const parsedSocketUrl = urlParams.get('socketUrl');
    
    function loadVideo() {
      // Use a relative URL so it automatically inherits the correct protocol, domain, and port!
      // This fixes ERR_CONNECTION_TIMED_OUT when behind a reverse proxy (like Cloudflare/Nginx)
      const hlsUrl = `/hls/live/${streamKey}/index.m3u8`;
      
      // FFmpeg takes a few seconds to write the first HLS chunks to disk. 
      // If we request it instantly, we get a 404 and Safari gives up.
      // So we poll the URL with HEAD requests until it's ready!
      function pollForStream() {
        fetch(hlsUrl, { method: 'HEAD' })
          .then(res => {
            if (res.ok) {
              video.src = hlsUrl;
              video.play().catch(e => console.log('Autoplay blocked:', e));
            } else {
              setTimeout(pollForStream, 1500); // Try again in 1.5 seconds
            }
          })
          .catch(() => setTimeout(pollForStream, 1500));
      }
      
      pollForStream();
    }

    loadVideo();

    // 2. Setup Socket.IO Chat
    const defaultSocketUrl = `${window.location.protocol}//${window.location.hostname}:3344`;
    const socketUrl = parsedSocketUrl || defaultSocketUrl;
    const socket = io(socketUrl);
    
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(msg) {
      const div = document.createElement('div');
      div.className = 'message';
      const userSpan = document.createElement('span');
      userSpan.className = 'msg-user';
      userSpan.textContent = msg.username || msg.user || 'Guest';
      div.appendChild(userSpan);
      div.appendChild(document.createTextNode(msg.text));
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    socket.on('history', (history) => {
      chatMessages.innerHTML = '';
      history.forEach(appendMessage);
    });

    socket.on('chat_message', (msg) => {
      appendMessage(msg);
    });

    function sendMessage() {
      if (!chatInput.value.trim()) return;
      socket.emit('chat_message', {
        id: Date.now(),
        username: 'iOS User',
        text: chatInput.value.trim(),
        ts: Date.now()
      });
      chatInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
